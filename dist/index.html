<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <style>
        body { padding: 1.5rem 0 3rem; }
        #table table { margin: 0 auto; }
        #table img { border-radius: 0.5rem; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); }
        #table td { padding: 0; }
    </style>
</head>

<body>
    <div class="container text-center">
        <h1 class="mb-4">Memory</h1>

        <!-- Login -->
        <div id="login" class="mx-auto" style="max-width: 22rem;">
            <div class="mb-3 text-start">
                <label for="SName" class="form-label">Player Name</label>
                <input type="text" class="form-control" id="SName" placeholder="Enter Player Name">
            </div>
            <div class="mb-3 text-start">
                <label for="Session" class="form-label">Session ID</label>
                <input type="text" class="form-control" id="Session" placeholder="Enter Session ID">
            </div>
            <div class="mb-3 text-start">
                <label for="inputGroupSelect01" class="form-label">Game size</label>
                <select class="form-select" id="inputGroupSelect01">
                    <option value="" selected>Game size</option>
                    <option value="4x4">4x4</option>
                    <option value="4x5">4x5</option>
                    <option value="5x6">5x6</option>
                    <option value="6x6">6x6</option>
                    <option value="6x7">6x7</option>
                    <option value="7x8">7x8</option>
                    <option value="8x8">8x8</option>
                </select>
            </div>
            <div id="warning" class="alert alert-danger d-none" role="alert">Please fill in all fields!</div>
            <button class="btn btn-primary w-100" id="btn_login">Submit</button>
        </div>

        <!-- Init / Lobby -->
        <div id="init" class="d-none">
            <div id="table" class="mb-3"></div>
            <div id="ready">
                <p>Click ready to start the game</p>
                <button class="btn btn-primary" id="btn_init">Ready</button>
            </div>
        </div>

        <!-- Game -->
        <div id="game" class="d-none">
            <h2 id="playingplayer" class="mb-4"></h2>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script src="client.js"></script>
</body>

</html>
