<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <style>
        :root {
            --accent: #6366f1;
            --accent-2: #ec4899;
        }

        * { font-family: 'Poppins', system-ui, sans-serif; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 2.5rem 0 4rem;
            color: #f8fafc;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #6d28d9 75%, #be185d 100%);
            background-attachment: fixed;
        }

        h1 {
            font-weight: 700;
            letter-spacing: .04em;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 6px 30px rgba(0, 0, 0, .25);
        }

        /* Glass panels */
        .glass {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 1.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 2rem;
        }

        .form-label { font-weight: 500; color: #e0e7ff; }

        .form-control, .form-select {
            background: rgba(255, 255, 255, .9);
            border: none;
            border-radius: .7rem;
            padding: .65rem .9rem;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 .25rem rgba(99, 102, 241, .45);
        }

        .btn-primary {
            border: none;
            border-radius: .8rem;
            padding: .65rem 1rem;
            font-weight: 600;
            letter-spacing: .02em;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 25px rgba(99, 102, 241, .4);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(236, 72, 153, .45);
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        /* Turn banner */
        #playingplayer {
            display: inline-block;
            font-weight: 600;
            padding: .6rem 1.4rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .18);
        }

        /* Points table */
        #playertable {
            color: #f8fafc;
            margin: 0 auto 1.5rem;
            min-width: 16rem;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 1rem;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .12);
        }
        #playertable th, #playertable td {
            padding: .6rem 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }
        #playertable thead td { font-weight: 600; color: #c7d2fe; text-transform: uppercase; font-size: .8rem; letter-spacing: .05em; }
        #playertable tr.active-player { background: rgba(99, 102, 241, .35); font-weight: 600; }

        /* Memory board */
        #board { margin: 0 auto; border-collapse: separate; border-spacing: 10px; }
        #board td { padding: 0; }

        .card-img {
            width: clamp(54px, 11vmin, 120px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
            cursor: pointer;
            display: block;
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .card-img:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 24px rgba(0, 0, 0, .45);
        }
        .card-img.flip { animation: flipIn .35s ease; }

        @keyframes flipIn {
            0%   { transform: perspective(600px) rotateY(90deg); opacity: .2; }
            100% { transform: perspective(600px) rotateY(0deg); opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="container text-center">
        <h1>🧠 Memory</h1>

        <!-- Login -->
        <div id="login" class="glass mx-auto" style="max-width: 24rem;">
            <div class="mb-3 text-start">
                <label for="SName" class="form-label">Player Name</label>
                <input type="text" class="form-control" id="SName" placeholder="Enter Player Name">
            </div>
            <div class="mb-3 text-start">
                <label for="Session" class="form-label">Session ID</label>
                <input type="text" class="form-control" id="Session" placeholder="Enter Session ID">
            </div>
            <div class="mb-4 text-start">
                <label for="inputGroupSelect01" class="form-label">Game size</label>
                <select class="form-select" id="inputGroupSelect01">
                    <option value="" selected>Choose a game size…</option>
                    <option value="4x4">4 × 4</option>
                    <option value="4x5">4 × 5</option>
                    <option value="5x6">5 × 6</option>
                    <option value="6x6">6 × 6</option>
                    <option value="6x7">6 × 7</option>
                    <option value="7x8">7 × 8</option>
                    <option value="8x8">8 × 8</option>
                </select>
            </div>
            <div id="warning" class="alert alert-danger d-none" role="alert">Please fill in all fields!</div>
            <button class="btn btn-primary w-100" id="btn_login">Submit</button>
        </div>

        <!-- Init / Lobby -->
        <div id="init" class="d-none">
            <div id="table" class="mb-4"></div>
            <div id="ready" class="glass mx-auto" style="max-width: 24rem;">
                <p class="mb-3">Waiting in the lobby — click ready to start the game.</p>
                <button class="btn btn-primary" id="btn_init">Ready</button>
            </div>
        </div>

        <!-- Game -->
        <div id="game" class="d-none">
            <h2 class="mb-4"><span id="playingplayer"></span></h2>
        </div>
    </div>

    <script src="vendor/jquery.min.js"></script>
    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="client.js"></script>
</body>

</html>
