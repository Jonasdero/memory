# Dependabot config — all updates grouped into one PR per ecosystem, monthly.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  labels:
  - dependencies
  assignees:
  - Jonasdero
  groups:
    all-dependencies:
      patterns:
      - '*'
